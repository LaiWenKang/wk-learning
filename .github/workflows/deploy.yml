name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One deploy at a time; let in-flight production deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync branch Pages fallback
        run: |
          rm -rf assets data icons manifest.webmanifest sw.js
          cp -R dist/assets assets
          cp -R dist/data data
          cp -R dist/icons icons
          cp dist/manifest.webmanifest manifest.webmanifest
          cp dist/sw.js sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data icons manifest.webmanifest sw.js
          if git diff --cached --quiet; then
            echo "Branch Pages fallback assets are already current."
          else
            git commit -m "build: update Pages fallback assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Self-heal: create the Pages site (or switch it from legacy
          # branch-based publishing) to the "GitHub Actions" source, so
          # the deploy never depends on a manual Settings → Pages step.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
