<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d12" />
    <meta
      name="description"
      content="WK Learning — a local-first personal learning, thinking and finance companion."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WK Learn" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>WK Learning</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0b0d12;
        color: #eceef3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #wk-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
        padding: 28px;
      }
      #wk-boot .spin {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(236, 238, 243, 0.18);
        border-top-color: #5b8def;
        animation: wk-spin 0.9s linear infinite;
      }
      #wk-boot .msg {
        font-size: 14px;
        color: #a2a9b8;
        max-width: 320px;
        line-height: 1.5;
      }
      #wk-boot .err {
        display: block;
        margin-top: 8px;
        font-size: 12px;
        color: #6e7585;
        word-break: break-word;
      }
      #wk-boot button {
        margin-top: 16px;
        min-height: 44px;
        padding: 10px 22px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #4f8bf7 0%, #7d6bf2 100%);
        color: #fff;
        font-family: inherit;
        font-size: 15px;
        font-weight: 650;
      }
      @keyframes wk-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <!--
      Boot guard: runs even if the app bundle never executes. It captures
      any load/runtime error, removes any legacy service worker + caches,
      and if the app hasn't mounted after a few seconds it either reloads
      once with a cache-buster (bundle never ran) or shows the captured
      error with a manual reset (bundle ran but couldn't start).
    -->
    <script>
      window.__wkErr = "";
      window.addEventListener(
        "error",
        function (e) {
          var m =
            e && e.message
              ? e.message
              : e && e.target && (e.target.src || e.target.href)
                ? "Failed to load " + (e.target.src || e.target.href)
                : "error";
          window.__wkErr = String(m).slice(0, 220);
        },
        true,
      );
      window.addEventListener("unhandledrejection", function (e) {
        window.__wkErr =
          "promise: " + String(e && e.reason ? e.reason : "").slice(0, 200);
      });

      (function () {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker
              .getRegistrations()
              .then(function (rs) {
                rs.forEach(function (r) {
                  r.unregister();
                });
              })
              .catch(function () {});
          }
          if (window.caches && caches.keys) {
            caches
              .keys()
              .then(function (ks) {
                ks.forEach(function (k) {
                  caches.delete(k);
                });
              })
              .catch(function () {});
          }
        } catch (e) {}

        function reset() {
          try {
            if (window.caches && caches.keys)
              caches.keys().then(function (ks) {
                ks.forEach(function (k) {
                  caches.delete(k);
                });
              });
            if ("serviceWorker" in navigator)
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                rs.forEach(function (r) {
                  r.unregister();
                });
              });
          } catch (e) {}
          try {
            sessionStorage.removeItem("wk-reload");
          } catch (e) {}
          location.replace(location.pathname + "?fresh=" + Date.now());
        }

        setTimeout(function () {
          if (!document.getElementById("wk-boot")) {
            try {
              sessionStorage.removeItem("wk-reload");
            } catch (e) {}
            return; // app mounted — all good
          }
          var loaded = !!window.__wkLoaded;
          var tried = false;
          try {
            tried = !!sessionStorage.getItem("wk-reload");
          } catch (e) {}

          if (!loaded && !tried) {
            // Bundle never executed — force a fresh copy once.
            try {
              sessionStorage.setItem("wk-reload", "1");
            } catch (e) {}
            location.replace(location.pathname + "?fresh=" + Date.now() + location.hash);
            return;
          }

          var msg = document.querySelector("#wk-boot .msg");
          var spin = document.querySelector("#wk-boot .spin");
          if (spin) spin.style.display = "none";
          if (msg) {
            msg.innerHTML =
              (loaded
                ? "The app loaded but couldn’t start."
                : "Couldn’t load the app.") +
              (window.__wkErr
                ? '<span class="err">' +
                  window.__wkErr.replace(/</g, "&lt;") +
                  "</span>"
                : "") +
              '<br><button id="wk-reset" type="button">Reset &amp; retry</button>';
            var b = document.getElementById("wk-reset");
            if (b) b.onclick = reset;
          }
        }, 5000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="wk-boot">
        <div class="spin"></div>
        <div class="msg">Loading WK Learning…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var isGitHubProjectPage =
          /\.github\.io$/.test(location.hostname) &&
          location.pathname.indexOf("/wk-learning") === 0;
        var rawDevEntry = document.querySelector(
          'script[type="module"][src="/src/main.tsx"]',
        );
        if (!isGitHubProjectPage || !rawDevEntry) return;

        var stylesheet = document.createElement("link");
        stylesheet.rel = "stylesheet";
        stylesheet.href = "assets/index.css";
        document.head.appendChild(stylesheet);

        var app = document.createElement("script");
        app.type = "module";
        app.src = "assets/index.js";
        document.head.appendChild(app);
      })();
    </script>
  </body>
</html>
